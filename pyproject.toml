[project]
name = "luckjingle-mcp"
version = "0.1.0"
description = "MCP server for printing to Luck Jingle / cat-printer style Bluetooth thermal label printers (e.g. NHOWIN Sticker Printer)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "bleak>=0.22.0",
    "pillow>=10.0.0",
]

[project.scripts]
luckjingle-mcp = "luckjingle_mcp.server:main"
luckjingle-daemon = "luckjingle_mcp.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luckjingle_mcp"]
